services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FIREBASE_SERVICE_ACCOUNT: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_KEY_PATH}:/run/secrets/firebase-service-account.json:ro

  realtime:
    build: ../backend-realtime
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      - api